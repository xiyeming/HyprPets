[package]
name = "hyprpet"
version = "0.1.0"
edition = "2024"
description = "Pixel desktop pet for Hyprland (Wayland layer-shell)"
license = "MIT"

[dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
calloop = "0.13"
calloop-wayland-source = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
signal-hook = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
notify = "8"
fontdb = "0.16"
fontdue = "0.9"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sysinfo = "0.37"
rmcp = { version = "0.8", features = ["client", "transport-child-process", "transport-io", "schemars"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "macros"] }
wayland-protocols = { version = "0.32", features = ["unstable", "staging"] }
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
opt-level = 2
debug = false
strip = true
lto = "thin"
